
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyPrescript | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-5">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <div class="text-center mb-8">
        <div class="inline-flex bg-blue-600 text-white p-3 rounded-xl mb-4">
            <span class="text-2xl font-bold">SP</span>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">SupplyPrescript</h1>
        <p class="text-slate-500 text-sm mt-2">
            Prescriptive Supply Chain Analytics
        </p>
    </div>

    <h2 class="text-xl font-bold text-slate-800 mb-2">Create Account</h2>
    <p class="text-sm text-slate-500 mb-6">
        Register to access your SupplyPrescript portal.
    </p>

    <form id="registerForm" class="space-y-4">

        <div>
            <label class="block text-sm font-semibold mb-2">Full Name</label>
            <input id="name" type="text" required minlength="2"
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter your full name">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Email Address</label>
            <input id="email" type="email" required
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter your email">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Password</label>
            <input id="password" type="password" required minlength="8" maxlength="128"
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Create a password">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Confirm Password</label>
            <input id="confirmPassword" type="password" required
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Confirm your password">
        </div>

        <p id="message" class="text-sm hidden"></p>

        <button id="registerButton" type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">
            Create Account
        </button>
    </form>

    <div id="successPanel" class="hidden mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">✓</div>
        <h3 class="font-bold text-blue-800">Registration Submitted!</h3>
        <p class="text-sm text-blue-700 mt-2">
            Your account is waiting for Admin approval.
            You can log in after your registration is approved.
        </p>
    </div>

    <p class="text-center text-sm text-slate-500 mt-6">
        Already have an account?
        <a href="login.html" class="text-blue-600 font-semibold">Sign In</a>
    </p>

</div>

<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.classList.add("hidden");

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.className = "text-sm text-red-600";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";

    try {
        const response = await fetch(
            "http://127.0.0.1:8000/api/auth/register",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Registration failed");
        }

        form.classList.add("hidden");
        document.getElementById("successPanel").classList.remove("hidden");

    } catch (error) {
        message.textContent = error.message;
        message.className = "text-sm text-red-600";
    } finally {
        button.disabled = false;
        button.textContent = "Create Account";
    }
});
</script>

</body>
</html>
